[project]
name = "sse-proxy-python-example"
version = "0.1.0"
description = "Python implementation example of an SSE proxy for streaming API responses."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.14.5",
  "fastapi>=0.150.0",
  "httpx>=0.28.1",
  "openai>=3.35.1",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.0",
  "uvicorn[standard]>=0.54.0"
]

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.17.1"
]

[project.scripts]
sse-proxy = "sse_proxy_python_example.main:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "error"
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.15"
typeCheckingMode = "basic"
